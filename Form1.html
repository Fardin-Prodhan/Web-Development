<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Application Form</h1>
    
    <form action="Application Form" method="post">

        <label for="name">First Name:</label>
        <input type="text" id="name">

        <label for="name2">Last Name:</label>
        <input type="text" id="name2">

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob">

        <label for="age">Age:</label>
        <input type="number" id="age">

        <br><br>

        <label for="gender">Gender:</label>
        <select id="gender">
            <option value="gender">Male</option>
            <option value="gender">Famale</option>
            <option value="gender">Others</option>
        </select>

        <label for="email">Email Address:</label>
        <input type="email" id="email">

        <br><br>

        <label for="position">Position Available:</label>

        <input type="radio" id="junior">
        <label for="junior">Junior Developer</label>

        <input type="radio" id="mid">
        <label for="mid">Mid-level Developer</label>

        <input type="radio" id="senior">
        <label for="senior">senior Developer</label>

        <br><br>

        <label for="lang">Programming Language:</label>

        <input type="checkbox">
        <label>Java</label>
        
        <input type="checkbox">
        <label>JavaScript</label>

        <input type="checkbox">
        <label>Python</label>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password">

        <label for="confirmpassword">Confirm Password:</label>
        <input type="password" id="confirmpassword">

        <br><br>

        <input type="submit">
        <input type="reset">

    </form>

</body>
</html>
